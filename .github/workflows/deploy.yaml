# Promote website changes from main to staging for beta testing or prod for production.
# Each branch deploys to its own Worker and GitHub environment.
name: deploy

on:
  push:
    branches:
      - prod
      - staging
  # Desktop releases use this to redeploy the corresponding website branch.
  workflow_dispatch:

# Deploys run one at a time, so the last push is the one that stays live.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
      url: ${{ github.ref_name == 'staging' && 'https://staging.trychord.app' || 'https://trychord.app' }}
    env:
      VITE_CHORD_CHANNEL: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Prerendering starts `wrangler dev`, which needs Node (see README).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN isn't set for the $VITE_CHORD_CHANNEL deployment"
            exit 1
          fi
          # Cloudflare keeps the message with the version, so
          # `wrangler deployments list` shows which commit each one is.
          message=$(git log -1 --format='%h %s' | cut -c1-100)
          if [ "$VITE_CHORD_CHANNEL" = staging ]; then
            # The staging custom domain is already attached to the Worker.
            tag="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            bunx wrangler versions upload --tag "$tag" --message "$message"
            bunx wrangler versions deploy --version-tag "$tag@100%" --message "$message" --yes
          else
            bunx wrangler deploy --message "$message"
          fi
